<!doctype html>
<meta charset="utf-8">
<title>Polisvakt — navigering</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 20px 18px 60px; background: #0b0f14; color: #eef4fa;
         font: 15px/1.5 -apple-system, system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #93a4b6; font-size: 13px; margin-bottom: 18px; }
  #summa { position: sticky; top: 0; background: #0b0f14; padding: 10px 0 12px;
           border-bottom: 1px solid #26323f; font-weight: 700; font-size: 17px; }
  .grupp { margin-top: 22px; }
  .grupp h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .07em;
              color: #93a4b6; margin: 0 0 8px; }
  .rad { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid #1a232d;
         align-items: baseline; }
  .ok   { color: #2fd07a; }
  .fel  { color: #ff4d4f; }
  .hopp { color: #ffb020; }
  .namn { flex: 1; min-width: 0; }
  .info { color: #6d7d8e; font-size: 12.5px; white-space: pre-wrap; }
  code { color: #8fcaff; }
</style>

<h1>Polisvakt — navigering</h1>
<p class="sub">
  Svängbeskrivningarna i <code>js/navigering.js</code>, körda utan nät och utan karta.<br>
  Hela poängen med modulen är att beslutet "vad ska sägas och när" går att
  provköra på en syntetisk rutt med en påhittad klocka. Går något sönder här
  hörs det i bilen som ett besked på fel plats.
</p>
<div id="summa">Kör…</div>
<div id="ut"></div>

<script type="module">
const ut = document.getElementById('ut');
let ok = 0, fel = 0, hopp = 0;
let grupp = null;

function G(namn) {
  grupp = document.createElement('div');
  grupp.className = 'grupp';
  grupp.innerHTML = `<h2>${namn}</h2>`;
  ut.appendChild(grupp);
}
function rad(status, namn, info) {
  const d = document.createElement('div');
  d.className = 'rad';
  const ikon = { ok: '✓', fel: '✗', hopp: '–' }[status];
  d.innerHTML = `<span class="${status}">${ikon}</span>` +
                `<span class="namn">${namn}</span>` +
                `<span class="info">${info ?? ''}</span>`;
  (grupp || ut).appendChild(d);
}
async function T(namn, fn) {
  try {
    const r = await fn();
    if (r === 'hopp') { hopp++; rad('hopp', namn, 'hoppad'); return; }
    if (r === true || r === undefined) { ok++; rad('ok', namn); return; }
    fel++; rad('fel', namn, String(r));
  } catch (e) { fel++; rad('fel', namn, e.message); }
}
const nara = (a, b, tol) => Math.abs(a - b) <= tol;

// Siffror som är värda att läsa av även när allt är grönt. Testerna fyller på
// den här och den skrivs ut sist, så rapporten kan citera faktiska värden i
// stället för "det gick igenom".
const matt = {};
const mat = (k, v) => { matt[k] = v; return v; };

/* =================================================================== */
const nav = await import('./js/navigering.js');
const { Navigering, Ruttlinje, beskrivManover, tolkaOsrmRutt,
        hamtaOsrmRutt, NavigeringsFel, NAV_PRIORITET, NAV_STANDARD } = nav;

/* ---------------- Provbana ----------------------------------------- */
//
// En rak öst-västlig väg och en sväng söderut. Meter räknas i ett lokalt plan
// runt Västerås, så en "leg" på 2000 m öst blir 2000 m i verkligheten också.

const LAT0 = 59.6099, LON0 = 16.5448;
const M_LAT = 111320;
const M_LON = 111320 * Math.cos(LAT0 * Math.PI / 180);
const pt = (ost, nord) => [LAT0 + nord / M_LAT, LON0 + ost / M_LON];

/**
 * Bygg en OSRM-liknande rutt av hörnpunkter i meter.
 *
 * Stegens distanser tas ur den uppmätta linjen och inte ur hörnavstånden, så
 * att skalfaktorn i byggStegIndex blir exakt 1 och testerna mäter modulens
 * logik i stället för avrundningen mellan två geodesier.
 */
function byggRutt(horn, manovrar, { punktSteg = 25, fartKmh = 50 } = {}) {
  const punkter = [];
  const hornIndex = [];
  for (let i = 0; i < horn.length - 1; i++) {
    const [ax, ay] = horn[i], [bx, by] = horn[i + 1];
    const len = Math.hypot(bx - ax, by - ay);
    const n = Math.max(1, Math.round(len / punktSteg));
    hornIndex.push(punkter.length);
    for (let k = 0; k < n; k++) {
      const t = k / n;
      punkter.push(pt(ax + (bx - ax) * t, ay + (by - ay) * t));
    }
  }
  hornIndex.push(punkter.length);
  punkter.push(pt(...horn[horn.length - 1]));

  const linje = new Ruttlinje(punkter);
  const mps = fartKmh / 3.6;
  const steg = manovrar.map((m, i) => {
    const start = linje.cum[hornIndex[i]];
    const slut = i + 1 < hornIndex.length ? linje.cum[hornIndex[i + 1]] : linje.lengthM;
    const d = Math.max(0, slut - start);
    return { ...m, distance: d, duration: d / mps };
  });
  return {
    punkter, steg, linje,
    distanceM: linje.lengthM,
    durationS: linje.lengthM / mps,
    mal: { lat: punkter[punkter.length - 1][0], lon: punkter[punkter.length - 1][1],
           label: 'Drottninggatan' },
  };
}

const M = {
  start: n => ({ name: n, maneuver: { type: 'depart' } }),
  hoger: n => ({ name: n, maneuver: { type: 'turn', modifier: 'right' } }),
  vanster: n => ({ name: n, maneuver: { type: 'turn', modifier: 'left' } }),
  framme: n => ({ name: n, maneuver: { type: 'arrive', modifier: 'right' } }),
};

/** Standardbanan: 2 km rakt, höger, 1 km, framme. */
const bana = () => byggRutt(
  [[0, 0], [2000, 0], [2000, -1000]],
  [M.start('Vasagatan'), M.hoger('Drottninggatan'), M.framme('Drottninggatan')]);

const T0 = 1_700_000_000_000;   // fast "klockslag" — modulen läser aldrig Date

function nyNav(rutt = bana(), opts = {}) {
  const n = new Navigering(opts);
  const start = n.satt(rutt, { nu: T0 });
  return { n, rutt, start };
}

/**
 * Kör bilen längs rutten och samla varje uppdatering.
 * Fixarna kommer i 1 Hz, som en riktig telefon.
 */
function kor(n, linje, { fran = 0, till, fartKmh = 50, t0 = T0, hz = 1, noggrannhet = 8 } = {}) {
  const mps = fartKmh / 3.6;
  const slut = till ?? linje.lengthM;
  const alla = [];
  let t = t0, s = fran;
  for (let i = 0; s <= slut + 1e-6 && i < 5000; i++) {
    const [lat, lon] = linje.pointAt(Math.min(s, linje.lengthM));
    alla.push({ s, ...n.uppdatera({ lat, lon, accuracy: noggrannhet, speedKmh: fartKmh, ts: t }, t) });
    s += mps / hz;
    t += 1000 / hz;
  }
  return alla;
}

const allaTal = rader => rader.flatMap(r => r.tal || []);
const bredvid = (linje, s, nordM) => {
  const [lat, lon] = linje.pointAt(s);
  return [lat + nordM / M_LAT, lon];
};

/* =================================================================== */
G('Svenska ur OSRM:s manövrar');

await T('sväng höger in på en namngiven gata', () => {
  const m = beskrivManover({ name: 'Drottninggatan', maneuver: { type: 'turn', modifier: 'right' } });
  return m.fras === 'sväng höger in på Drottninggatan' || `fick "${m.fras}"`;
});
await T('"nu"-varianten släpper gatunamnet', () => {
  const m = beskrivManover({ name: 'Sankt Olofsgatan', maneuver: { type: 'turn', modifier: 'left' } });
  return m.kort === 'sväng vänster' || `fick "${m.kort}"`;
});
await T('vägdelning blir "håll vänster", inte "sväng vänster"', () => {
  const m = beskrivManover({ ref: 'E18', maneuver: { type: 'fork', modifier: 'slight left' } });
  return m.fras.startsWith('håll vänster') || `fick "${m.fras}"`;
});
await T('rondell med tredje avfarten', () => {
  const m = beskrivManover({ name: 'Vasagatan', maneuver: { type: 'roundabout', modifier: 'right', exit: 3 } });
  return m.fras === 'kör av vid tredje avfarten i rondellen in på Vasagatan'
    || `fick "${m.fras}"`;
});
await T('rondell utan känd avfart gissar inte', () => {
  const m = beskrivManover({ maneuver: { type: 'roundabout', modifier: 'right' } });
  return (!m.fras.includes('avfarten') && m.fras.includes('rondellen')) || `fick "${m.fras}"`;
});
await T('avfart tar med avfartsnummer och skyltat mål', () => {
  const m = beskrivManover({
    name: '', ref: 'E18', exits: '132', destinations: 'E18: Stockholm, Enköping, Bålsta',
    maneuver: { type: 'off ramp', modifier: 'slight right' },
  });
  const bra = m.fras.includes('ta avfarten till höger') && m.fras.includes('avfart 132')
    && m.fras.includes('Stockholm och Enköping') && !m.fras.includes('Bålsta');
  return bra || `fick "${m.fras}"`;
});
await T('merge blir "fila in", inte en ordagrann översättning', () => {
  const m = beskrivManover({ ref: 'E18', maneuver: { type: 'merge', modifier: 'left' } });
  return m.fras === 'fila in till vänster på E18' || `fick "${m.fras}"`;
});
await T('ankomst säger vilken sida målet ligger på', () => {
  const m = beskrivManover({ maneuver: { type: 'arrive', modifier: 'left' } });
  return m.fras.includes('vänster sida') || `fick "${m.fras}"`;
});
await T('okänd manövertyp kraschar inte utan blir "fortsätt"', () => {
  const m = beskrivManover({ name: 'X', maneuver: { type: 'nåt-nytt-i-osrm' } });
  return m.fras.startsWith('fortsätt') || `fick "${m.fras}"`;
});
await T('vägnummer används när gatunamn saknas', () => {
  const m = beskrivManover({ name: '', ref: 'E18;E20', maneuver: { type: 'new name' } });
  return m.fras === 'fortsätt på E18' || `fick "${m.fras}"`;
});

/* =================================================================== */
G('Var på rutten är vi');

await T('rätt steg för en position mitt på rutten', () => {
  const { n, rutt } = nyNav();
  const [lat, lon] = rutt.linje.pointAt(1000);
  const t = n.uppdatera({ lat, lon, accuracy: 8, speedKmh: 50, ts: T0 + 1000 });
  const bra = t.stegIndex === 0 && t.nastaManover?.typ === 'turn'
    && nara(t.nastaManover.avstandM, 1000, 15);
  mat('stegMittPaRutten', { stegIndex: t.stegIndex, tillSvang: t.nastaManover?.avstandM });
  return bra || `steg ${t.stegIndex}, nästa ${t.nastaManover?.typ} om ${t.nastaManover?.avstandM} m`;
});

await T('steget växlar när svängen passerats', () => {
  const { n, rutt } = nyNav();
  const rader = kor(n, rutt.linje, { till: 2400 });
  const sist = rader[rader.length - 1];
  return (sist.stegIndex === 1 && sist.nastaManover?.typ === 'arrive')
    || `steg ${sist.stegIndex}, nästa ${sist.nastaManover?.typ}`;
});

await T('avståndet kvar minskar när man rör sig framåt', () => {
  const { n, rutt } = nyNav();
  const rader = kor(n, rutt.linje, { till: 1500 });
  let forra = Infinity, fall = 0;
  for (const r of rader) {
    if (r.kvarM > forra + 1) return `kvarM gick upp: ${forra} -> ${r.kvarM}`;
    if (r.kvarM < forra) fall++;
    forra = r.kvarM;
  }
  mat('kvarM', { forst: rader[0].kvarM, sist: rader[rader.length - 1].kvarM, minskningar: fall });
  return (fall >= rader.length - 2 && rader[rader.length - 1].kvarM < rader[0].kvarM - 1400)
    || `bara ${fall} minskningar av ${rader.length}`;
});

await T('ett stort hopp bakåt på linjen avvisas', () => {
  const { n, rutt } = nyNav();
  kor(n, rutt.linje, { till: 1000 });
  const fore = n.tillstand(T0 + 99000).s;
  // Fyrahundra meter bakåt på samma väg, från en fix till nästa. Det är inte
  // körning, det är en telefon som hittat fel satelliter.
  const [lat, lon] = rutt.linje.pointAt(600);
  const t = n.uppdatera({ lat, lon, accuracy: 12, speedKmh: 50, ts: T0 + 100000 }, T0 + 100000);
  return t.s >= fore - 1 || `s backade från ${fore} till ${t.s}`;
});

await T('men en riktig U-sväng följs bakåt', () => {
  // Skillnaden mot fallet ovan är takten. Kör man tillbaka samma väg flyttar
  // sig positionen fjorton meter per fix, och då ska den följa med — annars
  // fryser "kvar till målet" mitt i en vändning.
  const { n, rutt } = nyNav();
  kor(n, rutt.linje, { till: 1000 });
  let t = null;
  for (let k = 1; k <= 5; k++) {
    const [lat, lon] = rutt.linje.pointAt(1000 - k * 14);
    const ts = T0 + 100000 + k * 1000;
    t = n.uppdatera({ lat, lon, accuracy: 10, speedKmh: 50, ts }, ts);
  }
  return (t.s < 950 && t.lage === 'navigerar') || `s = ${t.s}, läge ${t.lage}`;
});

await T('restiden kvar summerar stegens egna varaktigheter', () => {
  // Motorväg först, stadstrafik sist. En linjär skalning av totaltiden mot
  // återstående sträcka skulle ge fel svar här, och det är hela poängen.
  const r = byggRutt([[0, 0], [8000, 0], [8000, -2000]],
    [M.start('E18'), M.hoger('Stora gatan'), M.framme('Stora gatan')]);
  r.steg[0].duration = 8000 / (100 / 3.6);     // 288 s
  r.steg[1].duration = 2000 / (30 / 3.6);      // 240 s
  r.durationS = 528;
  const n = new Navigering();
  n.satt(r, { nu: T0 });
  const [lat, lon] = r.linje.pointAt(8000);    // precis vid svängen
  const t = n.uppdatera({ lat, lon, accuracy: 8, speedKmh: 90, ts: T0 + 1000 });
  const linjart = Math.round(528 * (2000 / 10000));   // 106 s — vad fel svar vore
  mat('kvarS', { stegvis: t.kvarS, linjart, facit: 240 });
  return nara(t.kvarS, 240, 6) || `fick ${t.kvarS} s (stegvis facit 240, linjärt hade gett ${linjart})`;
});

await T('ankomsttiden är nu plus restiden kvar', () => {
  const { n, rutt } = nyNav();
  const [lat, lon] = rutt.linje.pointAt(500);
  const t = n.uppdatera({ lat, lon, accuracy: 8, speedKmh: 50, ts: T0 + 40000 });
  return t.ankomstTs === T0 + 40000 + t.kvarS * 1000 || `${t.ankomstTs} ≠ ${T0 + 40000} + ${t.kvarS}s`;
});

/* =================================================================== */
G('Rätt tid att säga till — farten styr');

await T('förvarningen kommer längre bort i 110 än i 50', () => {
  const kollaVid = fartKmh => {
    const { n, rutt } = nyNav();
    const rader = kor(n, rutt.linje, { till: 1990, fartKmh });
    const snart = allaTal(rader).find(y => y.fas === 'snart' && y.stegIndex === 1);
    return snart ? snart.avstandM : null;
  };
  const lag = kollaVid(50), hog = kollaVid(110);
  mat('snartAvstand', { kmh50: lag, kmh110: hog });
  if (lag == null || hog == null) return `saknas: 50→${lag}, 110→${hog}`;
  return hog > lag * 1.7 || `50 km/h gav ${lag} m, 110 km/h gav ${hog} m`;
});

await T('utlösningsavstånden skalar med farten', () => {
  const { n } = nyNav();
  const vid = kmh => n.utlosare(kmh);
  const a = vid(50), b = vid(110);
  mat('utlosare', {
    kmh50: { langt: Math.round(a.langtM), snart: Math.round(a.snartM), nu: Math.round(a.nuM) },
    kmh110: { langt: Math.round(b.langtM), snart: Math.round(b.snartM), nu: Math.round(b.nuM) },
  });
  return (b.snartM > a.snartM && b.nuM > a.nuM && b.langtM > a.langtM)
    || `50: ${JSON.stringify(a)} / 110: ${JSON.stringify(b)}`;
});

await T('förvarningen räknas i sekunder, inte i meter', () => {
  // 18 sekunder × farten, med golv och tak. Kontrollera mitt i intervallet
  // där varken golv eller tak biter.
  const { n } = nyNav();
  const u = n.utlosare(70);
  const forvantat = (70 / 3.6) * NAV_STANDARD.snartS;
  return nara(u.snartM, forvantat, 1) || `fick ${Math.round(u.snartM)} m, väntade ${Math.round(forvantat)} m`;
});

await T('"nu" kommer sist och utan gatunamn', () => {
  const { n, rutt } = nyNav();
  const rader = kor(n, rutt.linje, { till: 1999, fartKmh: 50 });
  const y = allaTal(rader).filter(x => x.stegIndex === 1);
  const nuY = y.find(x => x.fas === 'nu');
  mat('nuBesked', nuY ? { text: nuY.text, avstandM: nuY.avstandM } : null);
  if (!nuY) return 'inget "nu"-besked';
  const sist = y[y.length - 1] === nuY;
  return (sist && nuY.text === 'Sväng höger nu.' && nuY.avstandM <= 60)
    || `fick "${nuY.text}" på ${nuY.avstandM} m, sist=${sist}`;
});

await T('samma sväng annonseras aldrig två gånger i samma fas', () => {
  const { n, rutt } = nyNav();
  const rader = kor(n, rutt.linje, { fartKmh: 50 });
  const rakna = {};
  for (const y of allaTal(rader)) {
    if (y.typ !== 'sväng') continue;
    const k = `${y.stegIndex}:${y.fas}`;
    rakna[k] = (rakna[k] || 0) + 1;
  }
  mat('faserPerSvang', rakna);
  const dubbel = Object.entries(rakna).filter(([, v]) => v > 1);
  return dubbel.length === 0 || `upprepade: ${JSON.stringify(dubbel)}`;
});

await T('två identiska fixar ger bara ett besked', () => {
  const { n, rutt } = nyNav();
  const [lat, lon] = rutt.linje.pointAt(1800);   // 200 m före svängen
  const fix = { lat, lon, accuracy: 8, speedKmh: 50 };
  const a = n.uppdatera({ ...fix, ts: T0 + 1000 }, T0 + 1000);
  const b = n.uppdatera({ ...fix, ts: T0 + 2000 }, T0 + 2000);
  return (a.tal.length >= 1 && b.tal.length === 0)
    || `först ${a.tal.length} besked, sedan ${b.tal.length}`;
});

await T('korta kvarterssteg hoppar över förvarningen och säger bara "nu"', () => {
  // Tätortsbana: hörn var 150:e meter. En förvarning på 250 m skulle hamna
  // före föregående sväng, alltså ska den falla bort helt.
  const r = byggRutt([[0, 0], [150, 0], [150, -150], [300, -150], [300, -300]],
    [M.start('Kvartersgatan'), M.hoger('A-gatan'), M.vanster('B-gatan'),
     M.hoger('C-gatan'), M.framme('C-gatan')]);
  const n = new Navigering();
  n.satt(r, { nu: T0 });
  const rader = kor(n, r.linje, { fartKmh: 40 });
  const y = allaTal(rader).filter(x => x.typ === 'sväng');
  const faser = [...new Set(y.map(x => x.fas))];
  mat('tatortFaser', faser);
  return (!faser.includes('snart') && !faser.includes('langt') && faser.includes('nu'))
    || `fick faserna ${JSON.stringify(faser)}`;
});

await T('två svängar tätt ihop sägs i samma mening', () => {
  const r = byggRutt([[0, 0], [2000, 0], [2000, -100], [2400, -100]],
    [M.start('Vasagatan'), M.hoger('Kort gata'), M.vanster('Långgatan'), M.framme('Långgatan')]);
  const n = new Navigering();
  n.satt(r, { nu: T0 });
  const rader = kor(n, r.linje, { till: 1999, fartKmh: 50 });
  const y = allaTal(rader).find(x => x.stegIndex === 1 && x.fas === 'snart');
  mat('kedjeBesked', y?.text || null);
  return (y && /sedan sväng vänster/.test(y.text)) || `fick "${y?.text}"`;
});

await T('namnbyten sägs aldrig — de kräver ingenting av föraren', () => {
  // Precis det som hände på riktigt mellan Västerås och Stockholm: OSRM lade
  // in "new name" varje gång vägen bytte namn, och rösten sa "Fortsätt nu"
  // sju gånger på en resa.
  const r = byggRutt([[0, 0], [1200, 0], [2400, 0], [3600, 0], [3600, -600]],
    [M.start('Vasagatan'),
     { name: 'Stora gatan', maneuver: { type: 'new name' } },
     { name: 'Kopparbergsvägen', maneuver: { type: 'new name' } },
     M.hoger('Drottninggatan'), M.framme('Drottninggatan')]);
  const n = new Navigering();
  n.satt(r, { nu: T0 });
  const rader = kor(n, r.linje, { fartKmh: 70 });
  const texter = allaTal(rader).filter(y => y.typ === 'sväng').map(y => y.text);
  mat('namnbyten', texter);
  return !texter.some(t => /Fortsätt/.test(t)) || `sa ${JSON.stringify(texter)}`;
});

await T('avståndet räknas förbi namnbytena hela vägen till svängen', () => {
  const r = byggRutt([[0, 0], [1200, 0], [2400, 0], [3600, 0], [3600, -600]],
    [M.start('Vasagatan'),
     { name: 'Stora gatan', maneuver: { type: 'new name' } },
     { name: 'Kopparbergsvägen', maneuver: { type: 'new name' } },
     M.hoger('Drottninggatan'), M.framme('Drottninggatan')]);
  const n = new Navigering();
  n.satt(r, { nu: T0 });
  const [lat, lon] = r.linje.pointAt(600);      // mitt på FÖRSTA namnavsnittet
  const t = n.uppdatera({ lat, lon, accuracy: 8, speedKmh: 70, ts: T0 + 1000 }, T0 + 1000);
  mat('forbiNamnbyten', { typ: t.nastaManover?.typ, avstandM: t.nastaManover?.avstandM });
  return (t.nastaManover?.typ === 'turn' && nara(t.nastaManover.avstandM, 3000, 30))
    || `nästa ${t.nastaManover?.typ} om ${t.nastaManover?.avstandM} m (väntade turn om ~3000)`;
});

await T('"continue" med riktning är en riktig sväng och sägs', () => {
  const m = beskrivManover({ name: 'X', maneuver: { type: 'continue', modifier: 'left' } });

});

G('Körfält — vilka filer leder rätt');
//
// OSRM ger `steps[].intersections[].lanes` med en `valid`-flagga per fil.
// Datan finns alltså redan i svaret; det som testas här är tolkningen: vilken
// korsning filerna hämtas ur, vilken fil som är bäst att ligga i, och — minst
// lika viktigt — när anvisningen ska UTEBLI. En fil-rad som alltid ser likadan
// ut slutar föraren titta på, och då är den värre än ingen alls.

const { korfaltAnvisning, tolkaRiktning, valjKorfaltsKorsning } = nav;

/** En fil: giltig eller inte, plus dess pilar i vägbanan. */
const fil = (giltig, ...ind) => ({ valid: giltig, indications: ind });
/** OSRM:s location är [lon, lat] — tvärtom mot resten av appen. */
const loc = (ost, nord) => { const [lat, lon] = pt(ost, nord); return [lon, lat]; };
const korsning = (lanes, ost = 2000, nord = 0) => ({ location: loc(ost, nord), lanes });

/** En avfart åt höger vid 2000 m öst, med de filer man skickar in. */
const avfartMed = (lanes, extra = {}) => ({
  name: 'Avfart', exits: '132',
  maneuver: { type: 'off ramp', modifier: 'slight right', location: loc(2000, 0) },
  intersections: [korsning(lanes)],
  ...extra,
});

await T('avfart där två av fyra filer leder rätt', () => {
  const a = korfaltAnvisning(avfartMed([
    fil(false, 'straight'),
    fil(false, 'straight'),
    fil(true, 'straight', 'slight right'),
    fil(true, 'slight right'),
  ]));
  if (!a) return 'ingen anvisning alls';
  mat('avfartFyraFiler', {
    antal: a.antal, giltiga: a.giltiga, basta: a.bastaIndex,
    grupp: a.grupp, filer: a.filer.map(f => f.riktningar.join('+') + (f.giltig ? '' : ' (spärrad)')),
  });
  const bra = a.antal === 4
    && JSON.stringify(a.giltiga) === '[2,3]'
    // Fil 3 är avfartsfil; fil 2 delas med genomfarten och kan blockeras.
    && a.bastaIndex === 3
    && a.filer[3].rekommenderad === true && a.filer[2].rekommenderad === false
    && a.grupp.sida === 'höger' && a.grupp.antal === 2 && a.grupp.sammanhangande === true
    && a.kalla === 'manover';
  return bra || JSON.stringify({ giltiga: a.giltiga, basta: a.bastaIndex, grupp: a.grupp });
});

await T('bästa filen är inte "första giltiga"', () => {
  const a = korfaltAnvisning(avfartMed([
    fil(false, 'straight'),
    fil(false, 'straight'),
    fil(true, 'straight', 'slight right'),
    fil(true, 'slight right'),
  ]));
  return (a.bastaIndex !== a.giltiga[0] && a.bastaIndex === 3)
    || `valde ${a.bastaIndex}, giltiga ${a.giltiga}`;
});

await T('bästa filen väljs rätt när de giltiga inte ligger i kant', () => {
  // Fyra filer, ytterfilerna spärrade åt var sitt håll. Varken "första
  // giltiga" (1) eller "filen längst åt manöverhållet" (3) är svaret.
  const a = korfaltAnvisning(avfartMed([
    fil(false, 'straight'),
    fil(true, 'slight right'),
    fil(true, 'slight right'),
    fil(false, 'right'),
  ]));
  mat('bastaMittIVagbanan', { giltiga: a.giltiga, basta: a.bastaIndex, sida: a.grupp.sida });
  return (a.bastaIndex === 2 && a.grupp.sida === 'mitten' && a.grupp.antal === 2)
    || JSON.stringify({ basta: a.bastaIndex, grupp: a.grupp });
});

await T('alla filer giltiga ger INGEN anvisning', () => {
  const a = korfaltAnvisning(avfartMed([
    fil(true, 'straight', 'slight right'),
    fil(true, 'slight right'),
  ]));
  return a === null || `fick en anvisning ändå: ${JSON.stringify(a.giltiga)}`;
});

await T('korsning utan lanes ger ingen anvisning och ingen krasch', () => {
  const utanFiler = { name: 'Vasagatan',
    maneuver: { type: 'turn', modifier: 'right', location: loc(2000, 0) },
    intersections: [{ location: loc(2000, 0), bearings: [0, 90, 180], entry: [true, true, false] }] };
  const utanKorsningar = { name: 'Vasagatan', maneuver: { type: 'turn', modifier: 'right' } };
  const bra = korfaltAnvisning(utanFiler) === null
    && korfaltAnvisning(utanKorsningar) === null
    && korfaltAnvisning({}) === null
    && korfaltAnvisning(null) === null
    && korfaltAnvisning({ maneuver: { type: 'turn' }, intersections: [{ lanes: [] }] }) === null;
  return bra || 'något av tomfallen gav en anvisning';
});

await T('en fil med flera riktningar samtidigt', () => {
  const a = korfaltAnvisning({
    maneuver: { type: 'turn', modifier: 'right', location: loc(2000, 0) },
    intersections: [korsning([
      fil(false, 'left'),
      fil(true, 'left', 'straight', 'right'),
      fil(true, 'right'),
    ])],
  });
  const delad = a.filer[1];
  mat('deladFil', {
    riktningar: delad.riktningar, vinklar: delad.vinklar,
    symboler: delad.symboler, dedikerad: delad.dedikerad, huvud: delad.huvud,
  });
  const bra = JSON.stringify(delad.riktningar) === '["vänster","rakt","höger"]'
    && JSON.stringify(delad.vinklar) === '[-90,0,90]'      // sorterade vänster→höger
    && delad.dedikerad === false && delad.huvud === 'höger' && delad.ratt === true
    // Den dedikerade högerfilen slår den trevägsdelade.
    && a.bastaIndex === 2 && a.filer[2].dedikerad === true;
  return bra || JSON.stringify({ delad, basta: a.bastaIndex });
});

await T('vänstermanöver väljer den vänstra filen', () => {
  const a = korfaltAnvisning({
    maneuver: { type: 'turn', modifier: 'left', location: loc(2000, 0) },
    intersections: [korsning([
      fil(true, 'left'), fil(true, 'left', 'straight'),
      fil(false, 'straight'), fil(false, 'right'),
    ])],
  });
  return (a.bastaIndex === 0 && a.grupp.sida === 'vänster' && a.grupp.antal === 2)
    || JSON.stringify({ basta: a.bastaIndex, grupp: a.grupp });
});

await T('giltiga filer på båda sidor flaggas som osammanhängande', () => {
  // Händer där vägen delar sig åt båda hållen. Gränssnittet får då INTE skriva
  // "de två högra filerna" — blocket är bara halva sanningen.
  const a = korfaltAnvisning({
    maneuver: { type: 'turn', modifier: 'right', location: loc(2000, 0) },
    intersections: [korsning([fil(true, 'left'), fil(false, 'straight'), fil(true, 'right')])],
  });
  return (a.grupp.sammanhangande === false && a.bastaIndex === 2 && a.giltiga.length === 2)
    || JSON.stringify(a.grupp);
});

await T('ingen giltig fil alls ger ingen anvisning', () => {
  const a = korfaltAnvisning(avfartMed([fil(false, 'straight'), fil(false, 'left')]));
  return a === null || 'pekade ut en fil vi inte tror på';
});

await T('en enda fil är inget val', () => {
  const a = korfaltAnvisning(avfartMed([fil(false, 'straight')]));
  return a === null || 'gav anvisning för en enda fil';
});

await T('avgång och ankomst har inget filval', () => {
  const lanes = [fil(true, 'straight'), fil(false, 'right')];
  const bra = korfaltAnvisning({ maneuver: { type: 'depart' }, intersections: [korsning(lanes)] }) === null
    && korfaltAnvisning({ maneuver: { type: 'arrive' }, intersections: [korsning(lanes)] }) === null;
  return bra || 'gav filanvisning för depart/arrive';
});

await T('filer EFTER manövern läses aldrig', () => {
  // intersections[1] är en korsning man kör igenom efter svängen. Dess filer
  // handlar om nästa val, och att rita dem vore direkt vilseledande.
  const a = korfaltAnvisning({
    maneuver: { type: 'turn', modifier: 'right', location: loc(2000, 0) },
    intersections: [
      { location: loc(2000, 0), bearings: [0, 90], entry: [true, true] },
      korsning([fil(true, 'straight'), fil(false, 'right')], 2000, -300),
    ],
  });
  return a === null || 'tog filer från en korsning efter manövern';
});

await T('filer som delar sig sent hämtas ur steget före', () => {
  const innan = { name: 'E18', maneuver: { type: 'depart' }, intersections: [
    korsning([fil(true, 'straight')], 1000, 0),
    korsning([fil(false, 'straight'), fil(true, 'slight right')], 1975, 0),   // 25 m före
  ] };
  const a = korfaltAnvisning(avfartMed([]), innan);   // manöverkorsningen tom
  mat('sentDeladeFiler', a && { kalla: a.kalla, kallaAvstandM: a.kallaAvstandM, basta: a.bastaIndex });
  return (a && a.kalla === 'infart' && a.bastaIndex === 1 && nara(a.kallaAvstandM, 25, 2))
    || JSON.stringify(a);
});

await T('den skarpt uppmätta 95-metersdelningen ryms', () => {
  // Uppmätt i provkörningen Västerås → Stockholm: filskyltningen inför
  // påfarten mot Stockholm ligger 95 m före OSRM:s manöverpunkt. Med det
  // gamla 40-metersfönstret tappades den, trots att det är samma vägdelning.
  const innan = { maneuver: { type: 'depart' }, intersections: [
    korsning([fil(false, 'left'), fil(true, 'straight')], 1905, 0),
  ] };
  const a = korfaltAnvisning(avfartMed([]), innan);
  return (a && a.kalla === 'infart' && a.bastaIndex === 1 && nara(a.kallaAvstandM, 95, 3))
    || JSON.stringify(a);
});

await T('en korsning för långt före manövern räknas inte', () => {
  // Nästa lane-bärande korsning i samma provkörning som INTE hörde ihop med
  // sin manöver låg 946 m bort. Gränsen ligger mellan de två fallen.
  const pa = ost => ({ maneuver: { type: 'depart' },
    intersections: [korsning([fil(false, 'straight'), fil(true, 'slight right')], ost, 0)] });
  const bortom = [1875, 1800, 1054];          // 125 m, 200 m, 946 m före manövern
  for (const ost of bortom) {
    if (korfaltAnvisning(avfartMed([]), pa(ost)) !== null) {
      return `tog filer från en korsning ${2000 - ost} m bort`;
    }
  }
  return true;
});

await T('riktningarna översätts till kod, vinkel och pil', () => {
  const par = [['straight', 'rakt', 0], ['slight right', 'svagt-höger', 45],
    ['right', 'höger', 90], ['sharp left', 'skarpt-vänster', -135],
    ['uturn', 'u-sväng', -180], ['merge to left', 'fila-vänster', -30],
    ['none', 'ingen', 0]];
  for (const [osrm, kod, vinkel] of par) {
    const r = tolkaRiktning(osrm);
    if (!r || r.kod !== kod || r.vinkel !== vinkel) return `${osrm} → ${JSON.stringify(r)}`;
    if (!r.symbol) return `${osrm} saknar pil`;
  }
  // Understreck och versaler förekommer i andra motorer och äldre OSRM.
  if (tolkaRiktning('Slight_Right')?.kod !== 'svagt-höger') return 'normerar inte "Slight_Right"';
  if (tolkaRiktning('nåt-nytt') !== null) return 'hittade på en riktning';
  mat('riktningskoder', par.map(([o, k, v]) => `${o} → ${k} ${v}°`));
});

await T('valid_indication pekar ut pilen som ska lysa', () => {
  const a = korfaltAnvisning({
    maneuver: { type: 'turn', modifier: 'right', location: loc(2000, 0) },
    intersections: [korsning([
      { valid: false, indications: ['straight'] },
      { valid: true, indications: ['straight', 'right'], valid_indication: 'right' },
    ])],
  });
  return a.filer[1].huvud === 'höger' || `fick "${a.filer[1].huvud}"`;
});

await T('Mapbox-stilens "active" duger när "valid" saknas', () => {
  const a = korfaltAnvisning({
    maneuver: { type: 'turn', modifier: 'right', location: loc(2000, 0) },
    intersections: [korsning([
      { active: false, indications: ['straight'] },
      { active: true, indications: ['right'] },
    ])],
  });
  return (a && a.bastaIndex === 1) || JSON.stringify(a);
});

await T('en omarkerad fil skyltar ingenting men spärrar ingenting', () => {
  const a = korfaltAnvisning(avfartMed([
    fil(false, 'straight'), fil(true, 'none'),
  ]));
  return (a && a.filer[1].riktningar[0] === 'ingen' && a.bastaIndex === 1)
    || JSON.stringify(a);
});

/* ---------------- Kopplad till körningen ---------------- */

/** Standardbanan, men med filskyltning i svängen: bara högerfilen duger. */
const banaMedFiler = () => byggRutt(
  [[0, 0], [2000, 0], [2000, -1000]],
  [M.start('Vasagatan'),
    { name: 'Drottninggatan',
      maneuver: { type: 'turn', modifier: 'right', location: loc(2000, 0) },
      intersections: [korsning([fil(false, 'left'), fil(false, 'straight'), fil(true, 'right')])] },
    M.framme('Drottninggatan')]);

await T('filanvisningen dyker upp först inom förvarningshorisonten', () => {
  const { n, rutt } = nyNav(banaMedFiler());
  const langt = n.utlosare(50).langtM;
  const vid = s => {
    const [lat, lon] = rutt.linje.pointAt(s);
    return n.uppdatera({ lat, lon, accuracy: 8, speedKmh: 50, ts: T0 + s * 72 });
  };
  const tidigt = vid(1000);          // 1000 m kvar till svängen
  const intill = vid(1500);          // 500 m kvar
  mat('korfaltHorisont', {
    langtM: Math.round(langt),
    vid1000m: tidigt.korfalt === null ? 'ingen' : 'anvisning',
    vid1500m: intill.korfalt && { basta: intill.korfalt.bastaIndex, avstand: intill.korfalt.avstandM },
  });
  const bra = tidigt.korfalt === null && intill.korfalt
    && intill.korfalt.bastaIndex === 2 && intill.korfalt.stegIndex === 1
    && nara(intill.korfalt.avstandM, 500, 20);
  return bra || JSON.stringify({ tidigt: tidigt.korfalt, intill: intill.korfalt });
});

await T('ingen filanvisning medan vi är av rutten', () => {
  const { n, rutt } = nyNav(banaMedFiler());
  kor(n, rutt.linje, { till: 1500 });
  if (!n.tillstand(T0 + 200000).korfalt) return 'ingen anvisning ens på rutten';
  let t = null;
  for (let i = 0; i < 8; i++) {
    const [lat, lon] = bredvid(rutt.linje, 1500 + i * 20, 300);
    t = n.uppdatera({ lat, lon, accuracy: 8, speedKmh: 50, ts: T0 + 200000 + i * 1000 }, T0 + 200000 + i * 1000);
  }
  return (t.lage === 'avvikande' && t.korfalt === null)
    || `läge ${t.lage}, korfalt ${JSON.stringify(t.korfalt)}`;
});

await T('en rutt utan filuppgifter ger tyst null hela vägen', () => {
  const { n, rutt } = nyNav();
  const rader = kor(n, rutt.linje, { till: 2400 });
  return rader.every(r => r.korfalt === null) || 'hittade på en filanvisning';
});

await T('filanvisningen läses ALDRIG upp som tal', () => {
  // Kärnkravet. Röstkanalen är full: polisvarningar först, sedan svängar.
  const medFiler = nyNav(banaMedFiler());
  const utanFiler = nyNav();
  const talMed = allaTal(kor(medFiler.n, medFiler.rutt.linje, { till: 2400 }));
  const talUtan = allaTal(kor(utanFiler.n, utanFiler.rutt.linje, { till: 2400 }));
  mat('korfaltTystnad', {
    besked_med_filer: talMed.length, besked_utan_filer: talUtan.length,
    prioriteter: [...new Set(talMed.map(y => y.prioritet))],
  });
  if (talMed.length !== talUtan.length) {
    return `filerna skapade ${talMed.length - talUtan.length} extra besked`;
  }
  for (const y of talMed) {
    if ('korfalt' in y) return `yttrandet "${y.text}" bär filanvisning`;
    if (/\bfil(en|er|erna)?\b|högra fil|vänstra fil/i.test(y.text)) {
      return `yttrandet nämner filer: "${y.text}"`;
    }
  }
  return true;
});

const total = ok + fel + hopp;
const s = document.getElementById('summa');
s.textContent = `${ok} av ${total} gick igenom` +
  (fel ? ` — ${fel} MISSLYCKADES` : '') + (hopp ? ` — ${hopp} hoppade` : '');
s.className = fel ? 'fel' : 'ok';

const m = document.createElement('pre');
m.className = 'info';
m.style.cssText = 'margin-top:26px;padding-top:14px;border-top:1px solid #26323f';
m.textContent = 'Uppmätt:\n' + JSON.stringify(matt, null, 2);
ut.appendChild(m);

window.__resultat = { ok, fel, hopp, total, matt };
