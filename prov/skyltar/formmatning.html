/* =========================================================================
 * FORMMÄTNING AV 22 SVENSKA SKYLTAR
 *
 * Ingen ny facitruta sätts här. Rutorna är kopierade rakt ur
 * granskning.html (samma tal som matning.html) och vinkeletiketten är
 * matning.html:s egen.
 *
 * FRÅGAN: vilket spann måste formgrinden släppa igenom för att aldrig missa
 * en riktig skylt i de vinklar en dashcam ser?
 *
 * TVÅ OBEROENDE MÄTVÄGAR, för att en av dem bevisligen går sönder:
 *
 *   A. FACITRUTAN SJÄLV. bredd/höjd i pixlar. Ingen segmentering alls,
 *      alltså inget som kan läcka. Det är också exakt vad en axelparallell
 *      formgrind ser. Solid.
 *
 *   B. DEN MÖRKA TECKENRADEN inne i rutan. Tecknen är mörka mot ljus plåt
 *      oavsett vad som finns UTANFÖR skylten. Ur teckenradens klumpar faller
 *      lutning, teckenhöjd, teckenradens spann och en gir-mätning ut, och
 *      inget av det kan förgiftas av en vit bilkaross eller en vit
 *      studiobakgrund.
 *
 *   (C. Den ljusa plåtmasken mättes först, och den LÄCKER: på YBK70UD växer
 *      den ut i den vita karossen, på Regplat-URK och
 *      nya-skyltar-transportstyrelsen ut i den vita studiobakgrunden. Den
 *      räknas fortfarande, men varje rad där masken fyller mer än 92 % av
 *      utsnittet märks SAMMANVÄXT och hålls utanför medianerna. Det är den
 *      ärliga luckan i den här mätningen, inte ett tal att lita på.)
 *
 * UNDERLAGET ÄR TUNT OCH SNETT. 22 foton, mest närbilder och pressbilder.
 * Sex är rena studiobilder på en lös skylt. Ingen enda är tagen genom en
 * vindruta i fart, och ingen är under 87 px skyltbredd — en dashcam ser
 * 10–25 px. Talen härifrån duger som PRIOR och som RANGORDNING, aldrig som
 * veto. För att lita på dem på riktigt behövs några hundra bildrutor ur
 * verklig dashcamfilm, i mörker och regn, med skylten 10–30 px bred.
 * ========================================================================= */

/* ---- små hjälpare -------------------------------------------------------- */
const ut=document.getElementById('ut');let txt='';
const skriv=s=>{txt+=s+'\n';ut.textContent=txt;};
const n=(v,d=2)=>v==null||!isFinite(v)?'–':(+v).toFixed(d).replace('.',',');
const sortera=a=>[...a].sort((x,y)=>x-y);
function median(a){const v=sortera(a);if(!v.length)return NaN;const m=v.length>>1;
  return v.length%2?v[m]:(v[m-1]+v[m])/2;}
function kvantil(a,q){const v=sortera(a);if(!v.length)return NaN;
  const i=(v.length-1)*q,lo=Math.floor(i),hi=Math.ceil(i);
  return lo===hi?v[lo]:v[lo]+(v[hi]-v[lo])*(i-lo);}
const ladda=f=>new Promise((ok,nej)=>{const i=new Image();
  i.onload=()=>ok(i);i.onerror=()=>nej(new Error('kunde ej ladda '+f));
  i.src='./'+encodeURIComponent(f);});

function arBla(r,g,b){
  const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  if(mx<30)return false;
  if(d===0)return false;
  if((d/mx)<0.28)return false;
  if(b!==mx)return false;
  let h=(60*(4+(r-g)/d)+360)%360;
  return h>=195&&h<=265;
}
function otsu(hist,tot){
  let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];
  let sumB=0,wB=0,bast=-1,tro=127;
  for(let t=0;t<256;t++){
    wB+=hist[t];if(!wB)continue;const wF=tot-wB;if(wF<=0)break;
    sumB+=t*hist[t];
    const mB=sumB/wB,mF=(sum-sumB)/wF,v=wB*wF*(mB-mF)*(mB-mF);
    if(v>bast){bast=v;tro=t;}
  }
  return tro;
}
function konvexHolje(p){
  if(p.length<3)return p.slice();
  const s=[...p].sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const kryss=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const ned=[],upp=[];
  for(const q of s){while(ned.length>=2&&kryss(ned[ned.length-2],ned[ned.length-1],q)<=0)ned.pop();ned.push(q);}
  for(let i=s.length-1;i>=0;i--){const q=s[i];
    while(upp.length>=2&&kryss(upp[upp.length-2],upp[upp.length-1],q)<=0)upp.pop();upp.push(q);}
  ned.pop();upp.pop();return ned.concat(upp);
}
function minstaRektangel(holje){
  if(holje.length<3)return null;
  let bast=null;
  for(let i=0;i<holje.length;i++){
    const a=holje[i],b=holje[(i+1)%holje.length];
    const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);
    if(len<1e-9)continue;
    const ux=dx/len,uy=dy/len;
    let u0=Infinity,u1=-Infinity,v0=Infinity,v1=-Infinity;
    for(const p of holje){
      const u=p[0]*ux+p[1]*uy, v=-p[0]*uy+p[1]*ux;
      if(u<u0)u0=u;if(u>u1)u1=u;if(v<v0)v0=v;if(v>v1)v1=v;
    }
    const w=u1-u0,h=v1-v0,area=w*h;
    if(!bast||area<bast.area)bast={area,w,h,vinkel:Math.atan2(uy,ux)*180/Math.PI};
  }
  if(!bast)return null;
  const L=Math.max(bast.w,bast.h),K=Math.max(1e-9,Math.min(bast.w,bast.h));
  let vk=bast.w>=bast.h?bast.vinkel:bast.vinkel+90;
  while(vk>=90)vk-=180;while(vk<-90)vk+=180;
  return {L,K,area:bast.area,vinkel:vk};
}
/* Minsta-kvadrat-linje y = k·x + m, returnerar lutningen i grader. */
function linje(pts){
  const N=pts.length;if(N<2)return null;
  let sx=0,sy=0,sxx=0,sxy=0;
  for(const [x,y] of pts){sx+=x;sy+=y;sxx+=x*x;sxy+=x*y;}
  const d=N*sxx-sx*sx;if(Math.abs(d)<1e-9)return null;
  const k=(N*sxy-sx*sy)/d, m=(sy-k*sx)/N;
  let rest=0;for(const [x,y] of pts)rest+=Math.abs(y-(k*x+m));
  return {k,m,grader:Math.atan(k)*180/Math.PI,rest:rest/N};
}
/* Sammanhängande klumpar (8-grannar) i en 0/1-mask. */
function klumpar(mask,w,h){
  const et=new Int32Array(w*h).fill(-1),stack=new Int32Array(w*h);
  const lista=[];
  for(let i=0;i<w*h;i++){
    if(!mask[i]||et[i]>=0)continue;
    const id=lista.length;let sp=0;stack[sp++]=i;et[i]=id;
    let a=0,x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,sx=0,sy=0;
    while(sp){const q=stack[--sp];const qx=q%w,qy=(q/w)|0;
      a++;sx+=qx;sy+=qy;
      if(qx<x0)x0=qx;if(qx>x1)x1=qx;if(qy<y0)y0=qy;if(qy>y1)y1=qy;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy)continue;
        const nx=qx+dx,ny=qy+dy;
        if(nx<0||ny<0||nx>=w||ny>=h)continue;
        const ni=ny*w+nx;
        if(mask[ni]&&et[ni]<0){et[ni]=id;stack[sp++]=ni;}
      }}
    lista.push({id,area:a,x0,y0,x1,y1,w:x1-x0+1,h:y1-y0+1,cx:sx/a,cy:sy/a});
  }
  return {et,lista};
}

/* ========================================================================
 * MÄTNING AV EN SKYLT
 * ====================================================================== */
function mat(img,fr){
  const W=img.naturalWidth,H=img.naturalHeight;
  const bx=fr[0]*W,by=fr[1]*H,bw=fr[2]*W,bh=fr[3]*H;

  /* Utsnittet: facitrutan plus 20 % marginal, uppskalat så rutan blir
   * ~300 px bred. Marginalen finns bara för att plåtmasken (väg C) ska ha
   * rum att växa ut, så att man SER när den läcker. */
  const mar=0.20;
  const sx=Math.max(0,bx-bw*mar), sy=Math.max(0,by-bh*mar);
  const ex=Math.min(W,bx+bw*(1+mar)), ey=Math.min(H,by+bh*(1+mar));
  const sw=ex-sx, sh=ey-sy;
  const k=Math.min(6,300/bw);
  const cw=Math.max(30,Math.round(sw*k)), ch=Math.max(14,Math.round(sh*k));
  const c=document.createElement('canvas');c.width=cw;c.height=ch;
  const g=c.getContext('2d',{willReadFrequently:true});
  g.imageSmoothingQuality='high';
  g.drawImage(img,sx,sy,sw,sh,0,0,cw,ch);
  const p=g.getImageData(0,0,cw,ch).data, N=cw*ch;

  const fx0=Math.round((bx-sx)*k), fy0=Math.round((by-sy)*k);
  const fx1=Math.min(cw,Math.round((bx+bw-sx)*k)), fy1=Math.min(ch,Math.round((by+bh-sy)*k));
  const fw=fx1-fx0, fh=fy1-fy0;

  const V=new Uint8Array(N), bla=new Uint8Array(N);
  for(let i=0;i<N;i++){
    const r=p[i*4],gg=p[i*4+1],b=p[i*4+2];
    V[i]=Math.max(r,gg,b);
    if(arBla(r,gg,b))bla[i]=1;
  }

  /* ---- Otsu BARA inne i facitrutan. Bakgrunden utanför får inte flytta
   *      tröskeln — det var precis det som förgiftade första försöket. */
  const hR=new Uint32Array(256);let totR=0;
  let vMin=255,vMax=0,vSum=0;
  for(let y=fy0;y<fy1;y++)for(let x=fx0;x<fx1;x++){
    const v=V[y*cw+x];hR[v]++;totR++;vSum+=v;
    if(v<vMin)vMin=v;if(v>vMax)vMax=v;
  }
  const tro=otsu(hR,totR);
  const kontrast=vMax-vMin;

  /* ---- Andelar inne i rutan: plåt kontra ram ---------------------------- */
  let ljusR=0,morkR=0,blaR=0;
  for(let y=fy0;y<fy1;y++)for(let x=fx0;x<fx1;x++){
    const i=y*cw+x;
    if(bla[i])blaR++;
    if(V[i]>=tro)ljusR++;else morkR++;
  }

  /* ======================================================================
   * VÄG B — DEN MÖRKA TECKENRADEN
   * ==================================================================== */
  const mork=new Uint8Array(N);
  for(let y=fy0;y<fy1;y++)for(let x=fx0;x<fx1;x++){
    const i=y*cw+x;
    if(V[i]<tro && !bla[i]) mork[i]=1;   // det blå bandet är inte ett tecken
  }
  const {lista:mk}=klumpar(mork,cw,ch);
  /* En teckenklump: hög nog att vara en siffra, smal nog att inte vara ramen,
   * och den får inte klistra i rutans över- eller underkant (då är det ramen). */
  let tecken=mk.filter(o=>
      o.h>=fh*0.22 && o.h<=fh*0.92 &&
      o.w>=Math.max(1,fw*0.012) && o.w<=fw*0.30 &&
      o.area>=o.w*o.h*0.18 &&
      o.x0>=fx0-1 && o.x1<=fx1+1 && o.y0>=fy0-1 && o.y1<=fy1+1);
  /* Bara den dominerande raden: klumpar vars mitt ligger inom en halv
   * medianteckenhöjd från medianmitten. Skiljer bort landsbokstäver,
   * besiktningsmärken och en andra skylt som råkat komma med. */
  let radInfo=null;
  if(tecken.length>=3){
    const mCy=median(tecken.map(o=>o.cy)), mH=median(tecken.map(o=>o.h));
    tecken=tecken.filter(o=>Math.abs(o.cy-mCy)<=mH*0.6);
  }
  if(tecken.length>=3){
    tecken.sort((a,b)=>a.cx-b.cx);
    const mitt=tecken.map(o=>[o.cx,o.cy]);
    const bas =tecken.map(o=>[o.cx,o.y1]);   // teckenfötterna
    const tak =tecken.map(o=>[o.cx,o.y0]);   // teckentopparna
    const lm=linje(mitt), lb=linje(bas), lt=linje(tak);
    const hojder=tecken.map(o=>o.h);
    const halvt=Math.max(1,Math.floor(tecken.length/3));
    const hV=median(hojder.slice(0,halvt)), hH=median(hojder.slice(-halvt));
    const tx0=Math.min(...tecken.map(o=>o.x0)), tx1=Math.max(...tecken.map(o=>o.x1));
    radInfo={
      antal:tecken.length,
      lutning:lm?lm.grader:null,
      basLutning:lb?lb.grader:null,
      takLutning:lt?lt.grader:null,
      /* Gir/keystone ur tecknen: växer tecknen på ena sidan är skylten
       * vriden. Bakgrundsoberoende, till skillnad från plåtmasken. */
      teckenKeystone:Math.max(hV,hH)/Math.max(1e-9,Math.min(hV,hH)),
      /* Perspektivet syns också som att fot- och topplinjen INTE är
       * parallella. Skillnaden i grader är ett rent gir-/tippmått. */
      linjeSpretning:(lb&&lt)?Math.abs(lb.grader-lt.grader):null,
      teckenhojdAndel:median(hojder)/fh,
      textbreddAndel:(tx1-tx0+1)/fw,
      textMittAndel:((tx0+tx1)/2-fx0)/fw,
      radRakhet:lm?lm.rest/Math.max(1e-9,median(hojder)):null,
    };
  }

  /* ======================================================================
   * VÄG A/C — DEN LJUSA PLÅTMASKEN (läcker; märks SAMMANVÄXT)
   * ==================================================================== */
  const ljus=new Uint8Array(N);
  for(let i=0;i<N;i++) ljus[i]=(V[i]>=tro||bla[i])?1:0;
  const {et,lista:lk}=klumpar(ljus,cw,ch);
  const inne=new Float64Array(lk.length);
  for(let y=fy0;y<fy1;y++)for(let x=fx0;x<fx1;x++){
    const e=et[y*cw+x];if(e>=0)inne[e]++;
  }
  let vald=-1,b2=0;
  for(let i=0;i<lk.length;i++) if(inne[i]>b2){b2=inne[i];vald=i;}
  let plat=null, sammanvaxt=true;
  if(vald>=0){
    const o=lk[vald];
    /* SAMMANVÄXT: masken slickar utsnittets kant i båda led, alltså har den
     * ätit sig ut i kaross eller studiobakgrund. */
    sammanvaxt = (o.w>=cw*0.92 && o.h>=ch*0.92);
    const pts=[];
    for(let y=o.y0;y<=o.y1;y++)for(let x=o.x0;x<=o.x1;x++){
      if(et[y*cw+x]!==vald)continue;
      const kant=(x===0||y===0||x===cw-1||y===ch-1)||
        et[y*cw+x-1]!==vald||et[y*cw+x+1]!==vald||
        et[(y-1)*cw+x]!==vald||et[(y+1)*cw+x]!==vald;
      if(kant)pts.push([x,y]);
    }
    const rekt=minstaRektangel(konvexHolje(pts));
    if(rekt) plat={
      kvot:rekt.L/rekt.K, lutning:rekt.vinkel,
      rakhet:o.area/Math.max(1e-9,rekt.area),
      breddKvot:o.w/Math.max(1e-9,fw), hojdKvot:o.h/Math.max(1e-9,fh),
      L:rekt.L,K:rekt.K,
    };
  }

  /* ---- EU-bandet, mätt inne i rutan från vänsterkanten ------------------ */
  let euKol=0;
  for(let x=fx0;x<fx1;x++){
    let b=0,t=0;
    for(let y=fy0;y<fy1;y++){t++;if(bla[y*cw+x])b++;}
    if(b>=t*0.45)euKol++;else if(x-fx0>fw*0.35)break;else if(euKol>0)break;
  }

  return {
    /* VÄG A — ren geometri ur facitrutan, ingen segmentering */
    kvotRuta: bw/bh,
    breddPx: bw, hojdPx: bh,
    /* andelar inne i rutan */
    ljusandel: ljusR/totR, ramandel: morkR/totR, blaandel: blaR/totR,
    kontrast, tro,
    euAndel: euKol/fw,
    /* VÄG B — teckenraden */
    rad: radInfo,
    /* VÄG C — plåtmasken, ev. sammanvuxen */
    plat, sammanvaxt,
    _rit:{c,cw,ch,fx0,fy0,fw,fh,et,vald,tecken},
  };
}

/* ========================================================================
 * KÖR
 * ====================================================================== */
skriv('serviceWorker.controller = '+String(navigator.serviceWorker?.controller));
skriv('');

const rad=[];
for(const [fil,f] of Object.entries(FACIT)){
  let m;
  try{ m=mat(await ladda(fil),f.r); }
  catch(e){ skriv('FEL '+fil+': '+e.message); continue; }
  m.fil=fil;m.vinkel=f.v;m.svarighet=f.s;
  rad.push(m);
}

/* ========================================================================
 * LUTNINGEN DRAR DEN AXELPARALLELLA LÅDAN MOT KVADRAT
 *
 * En rektangel med långsidan L och kortsidan K, vriden θ grader, får en
 * axelparallell låda
 *      B = L·cosθ + K·sinθ      H = L·sinθ + K·cosθ
 * alltså kvoten
 *      kA = (R·cosθ + sinθ) / (R·sinθ + cosθ)      där R = L/K
 *
 * Det är HELA förklaringen till varför de lutade skyltarna i bänken mäter
 * 1,9–2,6 i en axelparallell låda fast de är vanliga 4,7-skyltar. Grinden
 * ser inte en squat skylt, den ser en vriden.
 *
 * Vänds sambandet får man tillbaka skyltens EGEN kvot ur lådan plus en
 * lutningsmätning:
 *      R = (kA·cosθ − sinθ) / (cosθ − kA·sinθ)
 *
 * Teckenradens lutning är en sådan mätning, och den är gratis: den faller
 * ut ur samma teckenklumpar som ändå ska räknas.
 */
const grad=g=>g*Math.PI/180;
function lutningsInflation(R,thetaGrader){
  const c=Math.cos(grad(Math.abs(thetaGrader))), s=Math.sin(grad(Math.abs(thetaGrader)));
  return (R*c+s)/(R*s+c);
}
function aterstalldKvot(kA,thetaGrader){
  const c=Math.cos(grad(Math.abs(thetaGrader))), s=Math.sin(grad(Math.abs(thetaGrader)));
  const namn=c-kA*s;
  if(namn<=1e-6)return null;            // lådan är redan kvadratisk, går ej vända
  const R=(kA*c-s)/namn;
  return R>0?R:null;
}
for(const r of rad){
  r.kvotAterstalld = r.rad ? aterstalldKvot(r.kvotRuta, r.rad.lutning) : null;
  r.inflation = r.rad ? r.kvotRuta/lutningsInflation(4.73, r.rad.lutning) : null;
}

/* ---- utelämna-ett: alla 22 utelämningarna, för varje storhet ------------ */
function sammanfatta(namn,valj,dagens){
  const par=rad.map(r=>({fil:r.fil,v:valj(r)})).filter(o=>o.v!=null&&isFinite(o.v));
  const alla=par.map(o=>o.v);
  if(!alla.length)return {namn,n:0,med:NaN,dagens};
  const med=median(alla);
  /* Utelämna varje BILD i tur och ordning (alla 22, även de som inte bidrar
   * till just den här storheten — då står medianen stilla, vilket är rätt
   * svar). */
  let uMin=Infinity,uMax=-Infinity,varstFil='–',varstD=-1;
  for(const r of rad){
    const u=par.filter(o=>o.fil!==r.fil).map(o=>o.v);
    if(!u.length)continue;
    const mu=median(u);
    if(mu<uMin)uMin=mu;if(mu>uMax)uMax=mu;
    const d=Math.abs(mu-med);
    if(d>varstD){varstD=d;varstFil=r.fil;}
  }
  return {namn,n:alla.length,med,
    min:Math.min(...alla),max:Math.max(...alla),
    p10:kvantil(alla,0.10),p90:kvantil(alla,0.90),
    uMin,uMax,rorelse:varstD,varstFil,dagens,alla};
}

  const d=document.createElement('canvas');
  const sk=Math.min(1,330/cw);

  g.save();g.scale(sk,sk);
  g.strokeStyle='#00ff88';g.lineWidth=1/sk;g.strokeRect(fx0,fy0,fw,fh);
  g.strokeStyle='#ff3b6b';
  for(const o of (tecken||[]))g.strokeRect(o.x0,o.y0,o.w,o.h);
  g.restore();
  const fig=document.createElement('figure');fig.appendChild(d);
  const cap=document.createElement('figcaption');
  cap.textContent=r.fil+'  kvR='+n(r.kvotRuta,2)+
    (r.sammanvaxt?' SAMV':' kvP='+n(r.plat?.kvot,2))+
