<!doctype html>
<meta charset="utf-8">
<title>Nyansgolvet 190 ↔ 198 — vad flytten faktiskt köper</title>
<style>body{background:#0b0f14;color:#eef4fa;font:12px/1.45 monospace;padding:12px}
pre{white-space:pre-wrap}.s{color:#2fd07a}.f{color:#ff7070}</style>
<pre id="ut">Kör…</pre>
<script type="module">
/*
 * MÄTNINGEN BAKOM ATT BLA_NYANS_MIN STÅR PÅ 198 OCH INTE 190.
 *
 * Flytten 198 → 190 motiverades en gång med att den hämtar in images.jpg:s
 * band (mediannyans 195,6°) "utan att en enda extra pixel någon annanstans
 * blir blå". Den här sidan mäter det påståendet i stället för att tro på det:
 * exakt samma pixeltest som skannaLjusa i js/plate.js — blå störst, V-fönster,
 * mättnadsgolv, renhet ELLER kroma, nyansfönster — körs två gånger per foto,
 * en gång med golvet 198 och en gång med 190. Enda skillnaden är golvet.
 *
 * Räknat per foto: hur många pixlar till klarar testet med 190, och var
 * hamnar de — INNE i en facitruta (kan vara band) eller UTANFÖR alla
 * facitrutor (kan aldrig vara band)?
 *
 * Facitrutorna är samma som i granskning.html/matning.html. Mäts både i
 * full upplösning och nedskalat till arbetsbredd 400 (sökningens värld).
 */
import { BLAGRIND, UTSEENDE } from '../../js/plate.js';

const FACIT = {
 'YBK70UD.jpg':[[0.3831,0.5773,0.2887,0.0918]],
 'polestar-4-madrid-gold.jpg':[[0.1606,0.5908,0.1455,0.0947]],
 'polestar-4-bak.webp':[[0.4408,0.7225,0.165,0.062]],
 'enlarged.jpg':[[0.3887,0.503,0.2206,0.0838]],
 '2039174f.avif':[[0.4692,0.5171,0.1144,0.0357]],
 '7751f94d.avif':[[0.4303,0.566,0.1442,0.0415]],
 '721ab0d6.avif':[[0.3851,0.5152,0.173,0.0274]],
 '0c4d9b68.jpg':[[0.2451,0.4801,0.1729,0.0363]],
 '9487480d.avif':[[0.3595,0.5695,0.26,0.0425]],
 '3b979c11.avif':[[0.4065,0.56,0.1975,0.0558],[0.0127,0.5745,0.0738,0.0535]],
 'images.jpg':[[0.384,0.3355,0.294,0.1085]],
 '1728543597268.jpg':[[0.1707,0.6481,0.1155,0.0563]],
 '521e24d0.avif':[[0.2906,0.6844,0.0969,0.0479]],
 'Regpl-Heden.jpg':[[0.0624,0.5187,0.1035,0.0592],[0.6247,0.5779,0.1482,0.0651]],
 'Regplat-URK.jpg':[[0.2265,0.4222,0.552,0.3245]],
 '2560.webp':[[0.1775,0.4595,0.6417,0.2342]],
 'renummer-131122.jpg':[[0.098,0.254,0.722,0.515]],
 'nya-regnummer-sverige.webp':[[0.1984,0.4291,0.5641,0.1712]],
 'Reg-nr-fram-flaggor.jpg':[[0.2417,0.4217,0.5767,0.125]],
 'nya-skyltar-transportstyrelsen.png':[[0.3658,0.117,0.6342,0.5244]],
 'd54eac78.png':[[0.4115,0.5807,0.191,0.0507]],
 'image.png':[[0.2633,0.3342,0.159,0.1233]],
};

const ladda = f => new Promise((ok, nej) => { const i = new Image();
  i.onload = () => ok(i); i.onerror = () => nej(new Error(f));
  i.src = './' + encodeURIComponent(f); });

/* Samma test som skannaLjusa, med nyansgolvet som parameter. */
function raknaBla(px, n, nyansMin) {
  let antal = 0; const mask = new Uint8Array(n);
  for (let i = 0, p = 0; i < n; i++, p += 4) {
    const r = px[p], g2 = px[p + 1], b2 = px[p + 2];
    if (b2 <= r || b2 <= g2) continue;
    const mn = r < g2 ? r : g2;
    const delta = b2 - mn;
    if (delta <= 0) continue;
    if (b2 < BLAGRIND.vMin * 255 || b2 > BLAGRIND.vMax * 255) continue;
    const mattnad = delta / b2;
    if (mattnad < BLAGRIND.mattnadMin) continue;
    if (mattnad < BLAGRIND.mattnadRen && delta < BLAGRIND.kromaMin) continue;
    const nyans = 240 + 60 * (r - g2) / delta;
    if (nyans < nyansMin || nyans > BLAGRIND.nyansMax) continue;
    mask[i] = 1; antal++;
  }
  return { antal, mask };
}

function matEn(img, rutor, bredd) {
  const skala = bredd ? Math.min(1, bredd / img.naturalWidth) : 1;
  const b = Math.max(4, Math.round(img.naturalWidth * skala));
  const h = Math.max(4, Math.round(img.naturalHeight * skala));
  const c = document.createElement('canvas'); c.width = b; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0, b, h);
  const px = g.getImageData(0, 0, b, h).data;
  const n = b * h;
  const m198 = raknaBla(px, n, 198), m190 = raknaBla(px, n, 190);
  const iFacit = i => {
    const x = (i % b) / b, y = ((i / b) | 0) / h;
    return rutor.some(([fx, fy, fw, fh]) => x >= fx && x <= fx + fw && y >= fy && y <= fy + fh);
  };
  let inne = 0, ute = 0;
  for (let i = 0; i < n; i++) {
    if (m190.mask[i] && !m198.mask[i]) { if (iFacit(i)) inne++; else ute++; }
  }
  return { bas: m198.antal, inne, ute };
}

const ut = document.getElementById('ut');
let txt = ''; const skriv = s => { txt += s + '\n'; ut.textContent = txt; };
skriv('nyansMax ' + BLAGRIND.nyansMax + ' · dagens nyansMin ' + BLAGRIND.nyansMin);
skriv('extra pixlar som 190 släpper in jämfört med 198, per foto:\n');
const sum = { full: { inne: 0, ute: 0 }, ab400: { inne: 0, ute: 0 } };
let varstProc = { fil: null, proc: -1 };
for (const [fil, rutor] of Object.entries(FACIT)) {
  const img = await ladda(fil);
  const f = matEn(img, rutor, 0);
  const a = matEn(img, rutor, 400);
  sum.full.inne += f.inne; sum.full.ute += f.ute;
  sum.ab400.inne += a.inne; sum.ab400.ute += a.ute;
  const proc = f.bas ? 100 * (f.inne + f.ute) / f.bas : (f.inne + f.ute ? Infinity : 0);
  if (proc > varstProc.proc) varstProc = { fil, proc };
  skriv(fil.padEnd(36) + ' full: +' + f.inne + ' i facit, +' + f.ute + ' utanför' +
        ' (bas 198: ' + f.bas + ', +' + (isFinite(proc) ? proc.toFixed(1) : '∞') + ' %)' +
        '   ab400: +' + a.inne + ' / +' + a.ute);
}
skriv('');
skriv('SUMMA full upplösning:  +' + sum.full.inne + ' i facitrutor, +' + sum.full.ute +
      ' utanför  (' + (sum.full.inne ? (sum.full.ute / sum.full.inne).toFixed(1) : '∞') +
      ' främmande per vunnen)');
skriv('SUMMA arbetsbredd 400:  +' + sum.ab400.inne + ' i facitrutor, +' + sum.ab400.ute + ' utanför');
skriv('värsta foto (relativ ökning av blå yta, full): ' + varstProc.fil + ' +' +
      (isFinite(varstProc.proc) ? varstProc.proc.toFixed(0) : '∞') + ' %');
window.__nyansgolv = { ...sum, varst: varstProc };
skriv('KLAR');
</script>
